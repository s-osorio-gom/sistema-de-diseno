name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tres-medios:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Estilo
        run: ruff check .
      - name: Pruebas
        run: pytest -q
      - name: Genera los tres medios, audita el bueno y el defectuoso
        run: python3 ejemplo/construir.py
